project:
  type: book
  output-dir: _book
  execute-dir: project
  resources:
    - downloads/lista-1-prova-1.pdf
    - downloads/tabela-normal-padrao.pdf

execute:
  freeze: auto

jupyter: python3

lang: pt

book:
  title: "Estatística - Bases 3"
  site-url: "https://BragaD.github.io/UnDF-Bases3-Estatistica-202602"
  repo-url: "https://github.com/BragaD/UnDF-Bases3-Estatistica-202602"
  repo-actions: [issue]
  favicon: images/favicon.png
  navbar:
    logo: images/logo-undf.png
    logo-alt: "Logo UnDF"
    title: "Estatística - Bases 3"
  date: today
  date-format: "DD/MM/YYYY"
  # Capítulos fechados por padrão na barra lateral: só o do capítulo aberto
  # fica expandido.
  sidebar:
    collapse-level: 1
  chapters:
    - text: "Início"
      href: index.qmd
    - part: "Introdução"
      chapters:
        - href: content/intro/01-por-que-estatistica.qmd
          text: "Por que Estatística?"
        - href: content/intro/02-paradoxo-simpson.qmd
          text: "O Paradoxo de Simpson"
    - part: "Capítulo 1: Análise Exploratória de Dados"
      chapters:
        - href: content/cap01/index.qmd
          text: "Visão Geral"
        - href: content/cap01/01-dados-estruturados.qmd
          text: "Elementos de Dados Estruturados"
        - href: content/cap01/02-dados-retangulares.qmd
          text: "Dados Retangulares"
        - href: content/cap01/03-estimativas-localizacao.qmd
          text: "Estimativas de Localização"
        - href: content/cap01/04-estimativas-variabilidade.qmd
          text: "Estimativas de Variabilidade"
        - href: content/cap01/05-distribuicao-dados.qmd
          text: "Explorando a Distribuição dos Dados"
        - href: content/cap01/06-dados-binarios-categoricos.qmd
          text: "Dados Binários e Categóricos"
        - href: content/cap01/07-correlacao.qmd
          text: "Correlação"
        - href: content/cap01/08-duas-ou-mais-variaveis.qmd
          text: "Duas ou Mais Variáveis"
    - part: "Capítulo 2: Probabilidade"
      chapters:
        - href: content/cap02/index.qmd
          text: "Visão Geral"
        - href: content/cap02/01-modelos-probabilisticos.qmd
          text: "Modelos Probabilísticos"
        - href: content/cap02/02-propriedades.qmd
          text: "Propriedades da Probabilidade"
        - href: content/cap02/03-contagem.qmd
          text: "Contagem e Probabilidade Clássica"
        - href: content/cap02/04-condicional-independencia.qmd
          text: "Probabilidade Condicional e Independência"
        - href: content/cap02/05-bayes.qmd
          text: "O Teorema de Bayes"
    - part: "Capítulo 3: Variáveis Aleatórias Discretas"
      chapters:
        - href: content/cap03/index.qmd
          text: "Visão Geral"
        - href: content/cap03/01-variaveis-aleatorias.qmd
          text: "Variável Aleatória e Função de Probabilidade"
        - href: content/cap03/02-valor-medio-variancia.qmd
          text: "Valor Médio e Variância"
        - href: content/cap03/03-distribuicao-acumulada.qmd
          text: "Função de Distribuição Acumulada"
        - href: content/cap03/04-uniforme-bernoulli.qmd
          text: "Uniforme Discreta e Bernoulli"
        - href: content/cap03/05-binomial.qmd
          text: "Distribuição Binomial"
        - href: content/cap03/06-hipergeometrica.qmd
          text: "Distribuição Hipergeométrica"
        - href: content/cap03/07-poisson.qmd
          text: "Distribuição de Poisson"
    - part: "Capítulo 4: Variáveis Aleatórias Contínuas"
      chapters:
        - href: content/cap04/index.qmd
          text: "Visão Geral"
        - href: content/cap04/01-variaveis-continuas.qmd
          text: "Variável Aleatória Contínua e Densidade"
        - href: content/cap04/02-valor-medio-continuo.qmd
          text: "Valor Médio e Variância de uma Variável Contínua"
        - href: content/cap04/03-distribuicao-acumulada-continua.qmd
          text: "Função de Distribuição Acumulada Contínua"
        - href: content/cap04/04-uniforme-continua.qmd
          text: "Distribuição Uniforme Contínua"
        - href: content/cap04/05-normal.qmd
          text: "Distribuição Normal"
        - href: content/cap04/06-exponencial.qmd
          text: "Distribuição Exponencial"
  page-navigation: true
  page-footer:
    border: true
    left: "UnDF — Engenharia de Software e Sistemas de Informação — Estatística — 2026.2"
    right:
      - icon: github
        href: "https://github.com/BragaD/UnDF-Bases3-Estatistica-202602"

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    number-sections: false
    include-in-header: modo-leitura.html
    include-after-body:
      - spoiler.html
      - sidebar-teclado.html
    toc: true
    toc-depth: 4
    toc-title: "Nesta página"
    link-external-icon: true
    link-external-newwindow: true
    code-copy: true
    code-overflow: wrap

bibliography: references.bib

# Numera figuras e tabelas por página (Figura 1, 2...), e não pelo número
# de ordem do arquivo no livro (Figura 16.1 numa seção 2.4).
crossref:
  chapters: false

editor: source
code-annotations: hover

author:
  - name: "Douglas Braga"
    email: "douglas.braga@undf.edu.br"
